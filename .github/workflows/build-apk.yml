name: Build Debug Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache Rust & Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src/main/cpp/rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate On-The-Fly Keystore (Llave en Caliente)
        run: |
          keytool -genkeypair -v \
            -keystore debug_action.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias debug_alias \
            -storepass androidpass \
            -keypass androidpass \
            -dname "CN=VideoWallpaper, OU=Dev, O=App, L=City, S=State, C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign Debug APK with Generated Keystore
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Signing APK at: $APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks debug_action.jks \
            --ks-pass pass:androidpass \
            --key-pass pass:androidpass \
            --ks-key-alias debug_alias \
            "$APK_PATH"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFondo-Debug-Signed
          path: app/build/outputs/apk/debug/*.apk
